  <style>
    :root{--blue:#0A2463;--cyan:#00C2CB;--dark:#111827;--gray:#6b7280;--border:#e5e7eb;--bg:#f8fafc;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--dark);}
    /* NAV */
    nav{background:white;border-bottom:1px solid var(--border);padding:0 40px;display:flex;align-items:center;justify-content:space-between;height:64px;position:sticky;top:0;z-index:100;}
    .nav-logo{font-family:'Playfair Display',serif;font-size:22px;font-weight:900;color:var(--blue);text-decoration:none;}
    .nav-logo span{color:var(--cyan);}
    .nav-links{display:flex;gap:24px;}
    .nav-links a{text-decoration:none;color:var(--gray);font-size:14px;font-weight:500;transition:color .2s;}
    .nav-links a:hover{color:var(--blue);}
    /* HERO */
    .page-hero{background:linear-gradient(135deg,var(--blue),#1a3a7a);color:white;padding:60px 40px;text-align:center;}
    .page-hero h1{font-family:'Playfair Display',serif;font-size:42px;font-weight:900;margin-bottom:12px;}
    .page-hero p{font-size:16px;opacity:.8;max-width:500px;margin:0 auto;}
    .author-banner{background:#00C2CB;color:white;padding:14px 40px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
    .author-banner strong{font-size:16px;}
    .author-banner a{color:white;text-decoration:underline;font-size:14px;cursor:pointer;}
    /* CONTROLS */
    .controls{max-width:1100px;margin:32px auto;padding:0 24px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
    .search-box{flex:1;min-width:200px;position:relative;}
    .search-box input{width:100%;padding:10px 16px 10px 40px;border:1px solid var(--border);border-radius:8px;font-size:14px;outline:none;background:white;}
    .search-box input:focus{border-color:var(--cyan);}
    .search-box::before{content:'🔍';position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;}
    select{padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:white;cursor:pointer;outline:none;}
    select:focus{border-color:var(--cyan);}
    /* GRID */
    .grid-wrap{max-width:1100px;margin:0 auto;padding:0 24px 60px;}
    .article-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}
    .card{background:white;border-radius:12px;border:1px solid var(--border);overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s;}
    .card:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(0,0,0,0.09);}
    .card-img{width:100%;height:180px;object-fit:cover;display:block;}
    .card-img-placeholder{width:100%;height:180px;background:linear-gradient(135deg,var(--blue),#1a3a7a);display:flex;align-items:center;justify-content:center;font-size:42px;}
    .card-body{padding:16px;}
    .card-badge{display:inline-block;background:#e0f7fa;color:#00838f;font-size:11px;font-weight:700;padding:3px 8px;border-radius:4px;margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px;}
    .card h3{font-size:15px;font-weight:700;color:var(--dark);line-height:1.5;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
    .card-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--gray);}
    .card-meta .author{font-weight:600;color:var(--blue);cursor:pointer;}
    .card-meta .author:hover{text-decoration:underline;}
    .dot{color:#d1d5db;}
    /* EMPTY */
    .empty{text-align:center;padding:80px 20px;color:var(--gray);}
    .empty h3{font-size:22px;margin-bottom:8px;color:var(--blue);}
    /* PAGINATION */
    .pagination{display:flex;justify-content:center;gap:8px;margin-top:32px;flex-wrap:wrap;}
    .pagination button{padding:8px 16px;border:1px solid var(--border);background:white;border-radius:8px;font-size:14px;cursor:pointer;transition:all .2s;}
    .pagination button.active{background:var(--blue);color:white;border-color:var(--blue);}
    .pagination button:hover:not(.active){border-color:var(--cyan);color:var(--cyan);}
    /* MODAL */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:none;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto;}
    .modal-overlay.open{display:flex;}
    .modal{background:white;border-radius:16px;max-width:760px;width:100%;padding:40px;position:relative;margin:auto;}
    .modal-close{position:absolute;top:16px;right:16px;background:none;border:none;font-size:22px;cursor:pointer;color:var(--gray);}
    .modal-badge{display:inline-block;background:#e0f7fa;color:#00838f;font-size:12px;font-weight:700;padding:4px 10px;border-radius:4px;margin-bottom:16px;text-transform:uppercase;}
    .modal h2{font-family:'Playfair Display',serif;font-size:28px;color:var(--blue);margin-bottom:16px;line-height:1.3;}
    .modal-meta{display:flex;align-items:center;gap:12px;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--border);}
    .modal-meta img{width:44px;height:44px;border-radius:50%;object-fit:cover;}
    .modal-meta-av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--cyan));display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:white;}
    .modal-img{width:100%;border-radius:10px;margin-bottom:24px;object-fit:cover;max-height:400px;}
    .modal-content{font-size:15px;line-height:1.85;color:#374151;white-space:pre-wrap;}
    .modal-footer{margin-top:28px;padding-top:20px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
    /* FOOTER */
    footer{background:var(--blue);color:rgba(255,255,255,.7);text-align:center;padding:32px 20px;font-size:13px;}
    footer a{color:var(--cyan);text-decoration:none;}
    /* LOADER */
    .loader{text-align:center;padding:60px;color:var(--gray);}
    @media(max-width:900px){.article-grid{grid-template-columns:repeat(2,1fr);}.page-hero h1{font-size:28px;}}
    @media(max-width:600px){.article-grid{grid-template-columns:1fr;}.controls{flex-direction:column;}.nav-links{display:none;}.page-hero{padding:40px 20px;}}
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="/"><span>Startup</span> Decoding</a>
  <div class="nav-links">

    <a href="/articles.html">Articles</a>

</nav>

<div class="page-hero">
  <h1>All Articles</h1>
  <p>Startup stories, founder journeys, funding news and more from across India</p>
</div>

<div id="author-banner" class="author-banner" style="display:none;">
  <strong><span id="banner-label">📝 Articles by:</span> <span id="banner-author-name"></span></strong>
  <a onclick="clearAllFilters()">✕ Clear filter — View all articles</a>
</div>

<div class="controls">
  <div class="search-box">
    <input type="text" id="search-input" placeholder="Search articles..." oninput="filterArticles()"/>
  </div>
  <select id="cat-filter" onchange="filterArticles()">
    <option value="">All Categories</option>
    <option>Startup News</option>
    <option>Startup Stories</option>
    <option>Young Entrepreneur</option>
    <option>Her Story</option>
    <option>Tech & Innovation</option>
    <option>Gov Schemes</option>
    <option>Trending</option>
  </select>
  <select id="sort-filter" onchange="filterArticles()">
    <option value="newest">Newest First</option>
    <option value="oldest">Oldest First</option>
  </select>
</div>

<div class="grid-wrap">
  <div id="article-grid" class="article-grid">
    <div class="loader">Loading articles...</div>
  </div>
  <div class="pagination" id="pagination"></div>
</div>

<!-- Article Modal -->
<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modal-body"></div>
  </div>
</div>

<footer>

</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({apiKey:'AIzaSyDpB7BMUeGidRxVDP_5S9Xru4eVmdVYSWI',authDomain:'startupdecoding-7b53a.firebaseapp.com',projectId:'startupdecoding-7b53a'});
const fsdb=firebase.firestore();
async function fbGet(col){try{const s=await fsdb.collection(col).get();return s.docs.map(d=>({...d.data(),id:d.id}));}catch(e){return[];}}
async function fbQuery(col,field,value){try{const s=await fsdb.collection(col).where(field,'==',value).get();return s.docs.map(d=>({...d.data(),id:d.id}));}catch(e){return[];}}
async function fbAdd(col,obj){try{const r=await fsdb.collection(col).add({...obj,created_at:new Date().toISOString()});return{id:r.id,...obj};}catch(e){}}
async function fbSet(col,id,obj){try{await fsdb.collection(col).doc(id).set({...obj},{merge:true});}catch(e){}}
async function fbDelete(col,id){try{await fsdb.collection(col).doc(id).delete();}catch(e){}}

async function loadArticles(){
  try{
    allArticles=await fbQuery('articles','status','published');
    allArticles.sort(function(a,b){return new Date(b.created_at)-new Date(a.created_at);});
  }catch(e){allArticles=[];}
  filterArticles();
}

function filterArticles(){
  var q=(document.getElementById('search-input').value||'').toLowerCase();
  var cat=document.getElementById('cat-filter').value;
  var sort=document.getElementById('sort-filter').value;
  // Use dropdown OR catParam from URL
  var activeCat=cat||catDecoded;
  filteredArticles=allArticles.filter(function(a){
    var matchQ=!q||(a.title||'').toLowerCase().includes(q)||(a.summary||'').toLowerCase().includes(q)||(a.content||'').toLowerCase().includes(q)||(a.author||'').toLowerCase().includes(q);
    var matchCat=!activeCat||(a.category||'').toLowerCase()===activeCat.toLowerCase();
    var matchAuthor=!authorFilter||(a.author||'').toLowerCase()===authorFilter.toLowerCase();
    return matchQ&&matchCat&&matchAuthor;
  });
  if(sort==='oldest')filteredArticles.reverse();
  currentPage=1;
  renderGrid();
  renderPagination();
}

function clearAuthorFilter(){
  authorFilter='';
  document.getElementById('author-banner').style.display='none';
  history.pushState({},'','/articles.html');
  filterArticles();
}

function clearAllFilters(){
  authorFilter='';
  catParam='';
  catDecoded='';
  document.getElementById('author-banner').style.display='none';
  document.getElementById('cat-filter').value='';
  document.getElementById('banner-label').textContent='📝 Articles by:';
  history.pushState({},'','/articles.html');
  filterArticles();
}

function renderGrid(){
  var grid=document.getElementById('article-grid');
  var start=(currentPage-1)*perPage;
  var page=filteredArticles.slice(start,start+perPage);
  if(!page.length){
    grid.innerHTML='<div class="empty" style="grid-column:1/-1"><h3>No articles found</h3><p>Try a different search or category.</p></div>';
    return;
  }
  grid.innerHTML=page.map(function(a){
    var img=a.image_url?'<img class="card-img" src="'+a.image_url+'" loading="lazy" onerror="this.style.display=\'none\'">'
      :'<div class="card-img-placeholder">📰</div>';
    var rt=a.hide_read_time?'':' · '+(a.read_time||Math.max(1,Math.ceil((a.content||'').split(' ').length/200)))+' min read';
    return '<div class="card" onclick="window.location.href=\'article.html?id='+a.id">' 
      +img
      +'<div class="card-body">'
        +'<span class="card-badge">'+(a.category||'Article')+'</span>'
        +'<h3>'+(a.title||'Untitled')+'</h3>'
        +'<div class="card-meta">'
          +'<span class="author" onclick="event.stopPropagation();filterByAuthor(\''+encodeURIComponent(a.author||'')+'\')">'+(a.author||'SD Team')+'</span>'
          +'<span class="dot">•</span>'
          +'<span>'+(a.date||'')+rt+'</span>'
        +'</div>'
      +'</div>'
    +'</div>';
  }).join('');
}

function filterByAuthor(enc){
  authorFilter=decodeURIComponent(enc);
  history.pushState({},'','/articles.html?author='+enc);
  document.getElementById('banner-author-name').textContent=authorFilter;
  document.getElementById('author-banner').style.display='flex';
  filterArticles();
}

function renderPagination(){
  var total=Math.ceil(filteredArticles.length/perPage);
  var pg=document.getElementById('pagination');
  if(total<=1){pg.innerHTML='';return;}
  var html='';
  for(var i=1;i<=total;i++){
    html+='<button class="'+(i===currentPage?'active':'')+'" onclick="goPage('+i+')">'+i+'</button>';
  }
  pg.innerHTML=html;
}

function goPage(n){currentPage=n;renderGrid();renderPagination();window.scrollTo({top:0,behavior:'smooth'});}

function openModal(id){
  var a=allArticles.find(function(x){return x.id===id||x.id==id;});
  if(!a)return;
  var rt=a.hide_read_time?'':' · '+(a.read_time||Math.max(1,Math.ceil((a.content||'').split(' ').length/200)))+' min read';
  var ini=(a.author||'S')[0].toUpperCase();
  var body='<span class="modal-badge">'+(a.category||'Article')+'</span>'
    +'<h2>'+(a.title||'Untitled')+'</h2>'
    +'<div class="modal-meta">'
      +'<div class="modal-meta-av">'+ini+'</div>'
      +'<div><div style="font-size:14px;font-weight:700;color:#0A2463;">By '+(a.author||'SD Team')+'</div>'
      +'<div style="font-size:12px;color:#6b7280;">'+(a.date||'')+rt+'</div></div>'
    +'</div>'
    +(a.image_url?'<img class="modal-img" src="'+a.image_url+'" onerror="this.style.display=\'none\'">':'')
    +'<div class="modal-content">'+(a.content||'No content available.')+'</div>';
  document.getElementById('modal-body').innerHTML=body;
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow='hidden';
}

function closeModal(){
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow='';
}

document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});

// INIT
window.addEventListener('load',function(){
  if(authorFilter){
    document.getElementById('banner-author-name').textContent=authorFilter;
    document.getElementById('author-banner').style.display='flex';
  }
  if(catDecoded&&!authorFilter){
    document.getElementById('banner-author-name').textContent=catDecoded;
    document.getElementById('author-banner').style.display='flex';
    document.getElementById('banner-label').textContent='📂 Category:';
    // Also set the dropdown to match
    var sel=document.getElementById('cat-filter');
    if(sel){sel.value=catDecoded;}
  }
  loadArticles();
});
</script>
</body>
